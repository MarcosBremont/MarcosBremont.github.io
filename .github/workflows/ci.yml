name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Syntax check core scripts (node --check)
        run: npm run test:syntax

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve site and run smoke test
        run: |
          npx http-server -p 8791 -s &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8791/index.html > /dev/null && break
            sleep 1
          done
          npm run test:smoke

      - name: Upload failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-failure-screenshot
          path: tests/screenshot_failure.png
          if-no-files-found: ignore
