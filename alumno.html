<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Actividades Pendientes — TinClass</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F0F4F8; color: #212121; min-height: 100vh; }

    .header {
      background: linear-gradient(135deg, #1565C0 0%, #1976D2 100%);
      color: #fff; padding: 24px 20px 20px; text-align: center;
    }
    .header .brand { font-size: 0.68rem; opacity: 0.75; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
    .header h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .header .sub { font-size: 0.82rem; opacity: 0.85; }

    .estudiante-card {
      max-width: 680px; margin: -1px auto 0; background: #fff;
      border-bottom: 3px solid #E3F2FD;
      padding: 16px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }
    .est-avatar {
      width: 46px; height: 46px; border-radius: 50%; background: #E3F2FD;
      display: flex; align-items: center; justify-content: center;
      color: #1565C0; font-size: 22px; flex-shrink: 0;
    }
    .est-info { flex: 1; }
    .est-nombre { font-size: 1.05rem; font-weight: 700; color: #0D47A1; }
    .est-meta { font-size: 0.78rem; color: #78909C; margin-top: 2px; }
    .est-badge {
      background: #EF5350; color: #fff; border-radius: 20px;
      padding: 4px 14px; font-size: 0.8rem; font-weight: 700; white-space: nowrap;
    }
    .est-badge.ok { background: #43A047; }

    .main { max-width: 680px; margin: 0 auto; padding: 18px 14px 60px; }

    .aviso-ok {
      background: #E8F5E9; border: 1.5px solid #A5D6A7; border-radius: 12px;
      padding: 28px 20px; text-align: center; color: #2E7D32;
    }
    .aviso-ok .material-icons { font-size: 48px; display: block; margin-bottom: 10px; }
    .aviso-ok strong { font-size: 1.1rem; display: block; margin-bottom: 4px; }
    .aviso-ok span { font-size: 0.88rem; color: #4CAF50; }

    .ra-section { margin-bottom: 18px; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    .ra-header {
      background: #E8EAF6; padding: 10px 16px;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .ra-header .material-icons { color: #3949AB; font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .ra-titulo { font-size: 0.88rem; font-weight: 700; color: #283593; line-height: 1.3; }
    .ra-desc { font-size: 0.74rem; color: #5C6BC0; margin-top: 1px; }

    .act-list { background: #fff; }
    .act-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 11px 16px; border-bottom: 1px solid #F5F5F5;
    }
    .act-item:last-child { border-bottom: none; }

    .act-estado {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 1px;
    }
    .act-estado.sin-nota { background: #FFF8E1; color: #F57F17; }
    .act-estado.nota-cero { background: #FFEBEE; color: #C62828; }
    .act-estado .material-icons { font-size: 15px; }

    .act-body { flex: 1; }
    .act-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
    .act-codigo {
      font-size: 0.82rem; font-weight: 700; color: #1565C0;
      background: #E3F2FD; border-radius: 5px; padding: 1px 7px;
    }
    .act-pts {
      font-size: 0.76rem; color: #78909C;
      background: #F5F5F5; border-radius: 5px; padding: 1px 7px;
    }
    .tag-cero {
      font-size: 0.7rem; font-weight: 700; background: #EF5350;
      color: #fff; border-radius: 4px; padding: 1px 6px;
    }
    .act-nombre { font-size: 0.85rem; color: #37474F; line-height: 1.4; }
    .act-fecha {
      font-size: 0.73rem; color: #90A4AE; margin-top: 3px;
      display: flex; align-items: center; gap: 3px;
    }
    .act-fecha .material-icons { font-size: 13px; }

    .footer {
      text-align: center; padding: 20px;
      font-size: 0.72rem; color: #B0BEC5;
    }
    .footer a { color: #90CAF9; text-decoration: none; }

    .error-box {
      max-width: 400px; margin: 60px auto; text-align: center; padding: 20px;
      background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .error-box .material-icons { font-size: 48px; color: #EF9A9A; display: block; margin-bottom: 12px; }
  </style>
</head>
<body>

<div id="app">
  <div style="text-align:center;padding:60px 20px;">
    <span class="material-icons spin" style="font-size:36px;color:#90CAF9;animation:spin 1s linear infinite;display:inline-block;">autorenew</span>
    <p style="margin-top:12px;color:#90A4AE;font-size:0.88rem;">Cargando...</p>
  </div>
</div>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function() {
  const cfg = {
    apiKey:            "AIzaSyA7-ES4dg5_2E9jpFMYqDIygN15GSpOnj0",
    authDomain:        "metabot-7af4d.firebaseapp.com",
    projectId:         "metabot-7af4d",
    storageBucket:     "metabot-7af4d.firebasestorage.app",
    messagingSenderId: "872698787040",
    appId:             "1:872698787040:web:9f8914b0601996d1f68c85"
  };
  if (!firebase.apps.length) firebase.initializeApp(cfg);
  window._alumnoDb = firebase.firestore();
})();
</script>
<script>
(function() {
  const app = document.getElementById('app');

  function escH(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(data) {
    const total = data.pendientes.reduce((s, ra) => s + ra.acts.length, 0);
    const tienePendientes = total > 0;

    let html = `
    <div class="header">
      <div class="brand">TinClass · Sistema de Planificación Educativa</div>
      <h1>Mis Actividades Pendientes</h1>
      <div class="sub">Generado el ${escH(data.fecha)}</div>
    </div>
    <div class="estudiante-card">
      <div class="est-avatar"><span class="material-icons">person</span></div>
      <div class="est-info">
        <div class="est-nombre">${escH(data.nombre)}</div>
        <div class="est-meta">${escH(data.curso)}</div>
      </div>
      ${tienePendientes
        ? `<div class="est-badge">${total} pendiente${total !== 1 ? 's' : ''}</div>`
        : `<div class="est-badge ok">¡Al día!</div>`}
    </div>
    <div class="main">`;

    if (!tienePendientes) {
      html += `
      <div class="aviso-ok">
        <span class="material-icons">check_circle</span>
        <strong>¡Felicitaciones! Estás al día.</strong>
        <span>No tienes actividades pendientes de calificar.</span>
      </div>`;
    } else {
      data.pendientes.forEach(ra => {
        if (!ra.acts || ra.acts.length === 0) return;
        html += `
        <div class="ra-section">
          <div class="ra-header">
            <span class="material-icons">assignment</span>
            <div>
              <div class="ra-titulo">${escH(ra.materia)}</div>
              ${ra.raDesc ? `<div class="ra-desc">${escH(ra.raDesc.substring(0, 80))}${ra.raDesc.length > 80 ? '…' : ''}</div>` : ''}
            </div>
          </div>
          <div class="act-list">`;

        ra.acts.forEach(a => {
          const esCero = a.cero === true;
          const estadoClass = esCero ? 'nota-cero' : 'sin-nota';
          const estadoIcon = esCero ? 'close' : 'hourglass_empty';
          html += `
          <div class="act-item">
            <div class="act-estado ${estadoClass}"><span class="material-icons">${estadoIcon}</span></div>
            <div class="act-body">
              <div class="act-top">
                <span class="act-codigo">${escH(a.ec || '?')}</span>
                ${a.pts ? `<span class="act-pts">${a.pts} pts</span>` : ''}
                ${esCero ? '<span class="tag-cero">nota 0</span>' : ''}
              </div>
              <div class="act-nombre">${escH(a.nombre || '')}</div>
              ${a.fecha ? `<div class="act-fecha"><span class="material-icons">event</span>${escH(a.fecha)}</div>` : ''}
            </div>
          </div>`;
        });

        html += `</div></div>`;
      });
    }

    html += `</div>
    <div class="footer">
      TinClass &mdash; Sistema de Planificación para Docentes · ETP República Dominicana
    </div>`;

    app.innerHTML = html;
  }

  function showError(msg) {
    app.innerHTML = `
    <div class="error-box">
      <span class="material-icons">link_off</span>
      <strong style="font-size:1rem;color:#37474F;display:block;margin-bottom:8px;">Link inválido</strong>
      <p style="font-size:0.85rem;color:#78909C;">${msg}</p>
    </div>`;
  }

  function normalizar(data) {
    // Soporte de claves cortas (links nuevos) y claves largas (links viejos)
    if (data.nombre) return data; // formato antiguo, sin cambios
    return {
      nombre: data.n,
      curso: data.c,
      fecha: data.f,
      pendientes: (data.p || []).map(ra => ({
        materia: ra.m,
        raDesc: ra.r || '',
        acts: (ra.a || []).map(a => ({
          ec: a.e,
          nombre: a.o,
          pts: a.t,
          fecha: a.d,
          cero: a.z
        }))
      }))
    };
  }

  const hash = window.location.hash.slice(1);
  if (!hash) { showError('Este link no contiene datos. Pídele al docente que genere un nuevo link.'); return; }

  // ID corto de Firestore: solo letras minúsculas y dígitos, longitud 5-10
  const esIdCorto = /^[a-z0-9]{5,10}$/.test(hash);

  if (esIdCorto && window._alumnoDb) {
    window._alumnoDb.collection('links_alumno').doc(hash).get()
      .then(doc => {
        if (!doc.exists) { showError('Este link no existe o ya expiró. Pídele al docente un link nuevo.'); return; }
        const raw = doc.data().data;
        const data = normalizar(raw);
        if (!data.nombre || !data.pendientes) { showError('Los datos del link están incompletos.'); return; }
        render(data);
      })
      .catch(() => showError('No se pudo cargar el link. Verifica tu conexión a internet.'));
  } else {
    // Fallback: LZString o base64 clásico
    try {
      let json = null;
      if (typeof LZString !== 'undefined') {
        json = LZString.decompressFromEncodedURIComponent(hash);
      }
      if (!json) {
        json = decodeURIComponent(escape(atob(hash)));
      }
      const raw = JSON.parse(json);
      const data = normalizar(raw);
      if (!data.nombre || !data.pendientes) { showError('Los datos del link están incompletos.'); return; }
      render(data);
    } catch(e) {
      showError('No se pudo leer el link. Es posible que esté dañado o incompleto.');
    }
  }
})();
</script>
</body>
</html>
